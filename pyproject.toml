[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-privesc-toolkit"
version = "0.1.0"
description = "Detection-only Linux privilege escalation automation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
privesc-toolkit = "privesc_toolkit.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
